<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeQuest — Account Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans min-h-screen p-4 md:p-8 antialiased">

    <header class="max-w-2xl mx-auto flex justify-between items-center pb-6 border-b border-slate-800 mb-8">
        <a href="dashboard.html" class="flex items-center gap-2 text-xs font-bold text-sky-400 hover:text-sky-300 transition">
            ← Back to Dashboard
        </a>
        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Account Settings</span>
    </header>

    <main class="max-w-2xl mx-auto space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
            <h2 class="text-xl font-black text-slate-100 flex items-center gap-2">⚙️ Profile & Preferences</h2>

            <form id="settings-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">Username</label>
                    <input type="text" id="setting-username" value="Student Scholar" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">Email Address</label>
                    <input type="email" id="setting-email" value="student@university.edu" disabled class="w-full bg-slate-950/50 border border-slate-800/80 rounded-xl p-3 text-sm text-slate-500 cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5">New Password</label>
                    <input type="password" id="setting-password" placeholder="Leave blank to keep unchanged" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-sky-500">
                </div>

                <div class="pt-4 flex justify-end">
                    <button type="submit" class="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-slate-950 font-black px-6 py-3 rounded-xl text-xs transition shadow-lg shadow-sky-500/20 active:scale-95">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('settings-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Settings updated successfully!");
        });
    </script>
</body>
</html>
