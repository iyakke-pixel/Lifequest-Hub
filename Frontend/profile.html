<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeQuest — Student Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans min-h-screen p-4 md:p-8 antialiased">

    <header class="max-w-4xl mx-auto flex justify-between items-center pb-6 border-b border-slate-800 mb-8">
        <a href="dashboard.html" class="flex items-center gap-2 text-xs font-bold text-sky-400 hover:text-sky-300 transition">
            ← Back to Dashboard
        </a>
        <span class="text-xs font-black text-slate-400 uppercase tracking-widest">Student Profile</span>
    </header>

    <main class="max-w-4xl mx-auto space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
            <div class="flex flex-col sm:flex-row items-center gap-6">
                <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center text-4xl shadow-xl shadow-sky-500/20 border border-sky-400/30">
                    🎓
                </div>
                <div class="text-center sm:text-left space-y-1">
                    <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
                        <h1 class="text-2xl font-black text-slate-100" id="profile-name">Student Scholar</h1>
                        <span class="text-[10px] bg-sky-500/10 text-sky-400 border border-sky-500/30 px-2.5 py-0.5 rounded-full font-bold">Level 1</span>
                    </div>
                    <p class="text-xs text-slate-400" id="profile-email">student@university.edu</p>
                    <p class="text-xs text-purple-400 font-semibold pt-1">Title: Study Apprentice 📖</p>
                </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-8 pt-6 border-t border-slate-800 text-center">
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Total XP</p>
                    <p class="text-xl font-black text-sky-400 mt-1">150 XP</p>
                </div>
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Login Streak</p>
                    <p class="text-xl font-black text-amber-400 mt-1">🔥 3 Days</p>
                </div>
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Quests Done</p>
                    <p class="text-xl font-black text-emerald-400 mt-1">12</p>
                </div>
                <div class="bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80">
                    <p class="text-[10px] text-slate-500 uppercase tracking-wider font-semibold">Bosses Slain</p>
                    <p class="text-xl font-black text-red-400 mt-1">2</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
