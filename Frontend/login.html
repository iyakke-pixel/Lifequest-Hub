<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeQuest - Login / Signup</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-6 shadow-2xl relative">
        
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-extrabold text-sky-400">🎮 LifeQuest</h1>
            <p class="text-xs text-slate-400">Sign in to track your student quests and rewards</p>
        </div>

        <div class="flex border-b border-slate-800 text-sm font-semibold">
            <button id="tab-login" type="button" class="w-1/2 py-2 text-sky-400 border-b-2 border-sky-400">Login</button>
            <button id="tab-signup" type="button" class="w-1/2 py-2 text-slate-400 hover:text-slate-200">Sign Up</button>
        </div>

        <div id="alert-msg" class="hidden p-3 rounded-lg text-xs bg-red-900/50 border border-red-800 text-red-300"></div>

        <form id="auth-form" class="space-y-4">
            <div class="space-y-3">
    <button type="button" onclick="handleGoogleSignIn()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-100 font-medium py-2.5 rounded-lg flex items-center justify-center gap-2 border border-slate-700 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
    </button>

    <div class="flex items-center my-4">
        <div class="flex-grow border-t border-slate-800"></div>
        <span class="px-3 text-xs text-slate-500">OR</span>
        <div class="flex-grow border-t border-slate-800"></div>
    </div>
</div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                <input type="text" id="username" required placeholder="Enter your username" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-sky-500 focus:outline-none">
            </div>

            <div id="email-field" class="hidden">
                <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                <input type="email" id="email" placeholder="student@university.edu" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-sky-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-100 focus:border-sky-500 focus:outline-none">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold py-2.5 rounded-lg transition duration-200">
                Login
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="index.html" class="text-xs text-slate-500 hover:text-sky-400 transition">← Back to Home</a>
        </div>

    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        let isLogin = true;

        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const emailField = document.getElementById('email-field');
        const submitBtn = document.getElementById('submit-btn');
        const alertMsg = document.getElementById('alert-msg');

        // Toggle Tabs
        tabLogin.addEventListener('click', () => setMode(true));
        tabSignup.addEventListener('click', () => setMode(false));

        function setMode(loginMode) {
            isLogin = loginMode;
            alertMsg.classList.add('hidden');
            if (isLogin) {
                tabLogin.className = "w-1/2 py-2 text-sky-400 border-b-2 border-sky-400";
                tabSignup.className = "w-1/2 py-2 text-slate-400 hover:text-slate-200";
                emailField.classList.add('hidden');
                submitBtn.innerText = "Login";
            } else {
                tabSignup.className = "w-1/2 py-2 text-sky-400 border-b-2 border-sky-400";
                tabLogin.className = "w-1/2 py-2 text-slate-400 hover:text-slate-200";
                emailField.classList.remove('hidden');
                submitBtn.innerText = "Create Account";
            }
        }

        // Handle Form Submission
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            alertMsg.classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value.trim();

            const endpoint = isLogin ? "/api/auth/login" : "/api/auth/signup";
            const body = isLogin ? { username, password } : { username, email, password };

            try {
                const res = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "Authentication failed");
                }

                // Save token & username to localStorage
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('username', data.username);

                // Redirect to dashboard
                window.location.href = "dashboard.html";

            } catch (err) {
                alertMsg.innerText = err.message;
                alertMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
